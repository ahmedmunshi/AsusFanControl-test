name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Restore NuGet packages
      run: nuget restore AsusFanControl.sln

    - name: Build Release x64
      run: |
        & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\bin\MSBuild.exe" AsusFanControl.sln /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin/

    - name: Get version tag
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -match '^v') {
          $version = $tag.Substring(1)
        } else {
          $version = "latest"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create zip artifact
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        if ($version -eq "latest") {
          $zipName = "AsusFanControlGUI-portable.zip"
        } else {
          $zipName = "AsusFanControlGUI-v$version.zip"
        }
        Compress-Archive -Path bin\* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AsusFanControlGUI-build
        path: AsusFanControlGUI-*.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          AsusFanControlGUI-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}